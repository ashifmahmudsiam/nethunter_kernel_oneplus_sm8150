name: Build NetHunter Kernel

on:
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex libssl-dev wget tar python3 zip unzip build-essential libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Cache Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchains
          key: ${{ runner.os }}-clang-r563880c-v1

      - name: Setup Toolchain (Clang)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Toolchain..."
          mkdir -p toolchains
          cd toolchains
          wget -O clang-r563880c.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/f8439f0628d799092dd07df440a6334cab28939c/clang-r563880c.tar.gz"
          tar -xvf clang-r563880c.tar.gz
          cd ..

      - name: Merge Defconfigs and Auto-Configure
        run: |
          export PATH=$PWD/toolchains/bin:$PATH
          mkdir -p out
          # ডেভেলপারের build.sh অনুযায়ী ডিফল্ট কনফিগ মার্জ করা
          KCONFIG_CONFIG=out/.config scripts/kconfig/merge_config.sh -r \
            arch/arm64/configs/vendor/sm8150-perf_defconfig \
            arch/arm64/configs/vendor/oplus.config
          
          # জরুরি কনফিগ অপশনগুলো জোর করে বসানো (মিসিং ফাংশন দূর করার জন্য)
          echo "CONFIG_COMPAT=y" >> out/.config
          echo "CONFIG_NR_CPUS=8" >> out/.config
          echo "CONFIG_WERROR=n" >> out/.config
          echo "CONFIG_PERF_EVENTS=y" >> out/.config
          echo "CONFIG_HAVE_HW_BREAKPOINT=y" >> out/.config
          echo "CONFIG_IPC_LOGGING=y" >> out/.config
          echo "CONFIG_PCI_MSM=y" >> out/.config
          echo "CONFIG_PCI_MSM_LEGACY=y" >> out/.config
          echo "CONFIG_PINCTRL=y" >> out/.config
          echo "CONFIG_PINCTRL_MSM=y" >> out/.config
          echo "CONFIG_QCOM_SMEM=y" >> out/.config
          echo "CONFIG_MSM_BUS_SCALING=y" >> out/.config
          echo "CONFIG_QCOM_ICE=y" >> out/.config
          echo "CONFIG_ARM_SMMU=y" >> out/.config
          echo "CONFIG_QCOM_SCM=y" >> out/.config
          echo "CONFIG_QCOM_SMD=y" >> out/.config
          echo "CONFIG_QCOM_RPMH=y" >> out/.config
          echo "CONFIG_MAILBOX=y" >> out/.config
          echo "CONFIG_ARCH_QCOM=y" >> out/.config
          echo "CONFIG_MMC_SDHCI=y" >> out/.config
          echo "CONFIG_MMC_SDHCI_PLTFM=y" >> out/.config
          echo "CONFIG_CRYPTO_QTI=y" >> out/.config
          echo "CONFIG_SCSI_UFS_QCOM=y" >> out/.config
          echo "CONFIG_SCSI_UFS_CRYPTO_QTI=y" >> out/.config
          echo "CONFIG_UFS_FEATURE_LPM=y" >> out/.config
          echo "CONFIG_SPMI=y" >> out/.config
          echo "CONFIG_SPMI_MSM_PMIC_ARB=y" >> out/.config
          echo "# CONFIG_MHI_BUS_ARCH_QCOM is not set" >> out/.config
          echo "# CONFIG_MHI_BUS is not set" >> out/.config
          
          # অটো-কনফিগারেশন কমান্ড
          make ARCH=arm64 O=out \
            KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error=declaration-after-statement" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 AS=llvm-as \
            olddefconfig

      - name: Build Kernel (Image.gz)
        run: |
          export PATH=$PWD/toolchains/bin:$PATH
          export KCFLAGS="-DFULL_THROTTLE_BOOST=1 -DMSM_DRM_ONSCREENFINGERPRINT_EVENT=1 -Wno-error=implicit-function-declaration -Wno-error=declaration-after-statement -Wno-error=unused-variable -Wno-error=int-conversion"
          make -j$(nproc) ARCH=arm64 O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 AS=llvm-as \
            Image.gz

      - name: Build Modules
        run: |
          export PATH=$PWD/toolchains/bin:$PATH
          export KCFLAGS="-DFULL_THROTTLE_BOOST=1 -DMSM_DRM_ONSCREENFINGERPRINT_EVENT=1 -Wno-error=implicit-function-declaration -Wno-error=declaration-after-statement -Wno-error=unused-variable -Wno-error=int-conversion"
          make -j$(nproc) ARCH=arm64 O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 AS=llvm-as \
            modules

      - name: Clone AnyKernel3 & Prepare Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git -b master
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          mkdir -p AnyKernel3/modules
          find out -name "*.ko" -exec cp {} AnyKernel3/modules/ \;
          cd AnyKernel3
          zip -r ../NetHunter_Kernel_OnePlus_SM8150.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-Zip
          path: NetHunter_Kernel_OnePlus_SM8150.zip
