name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex libssl-dev wget tar python3 zip unzip build-essential libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Cache Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchains
          key: ${{ runner.os }}-clang-r563880c-v1

      - name: Setup Toolchain (Clang)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Toolchain..."
          mkdir -p toolchains
          cd toolchains
          wget -O clang-r563880c.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/f8439f0628d799092dd07df440a6334cab28939c/clang-r563880c.tar.gz"
          tar -xvf clang-r563880c.tar.gz
          cd ..

      - name: Merge Defconfigs
        run: |
          export PATH=$PWD/toolchains/bin:$PATH
          mkdir -p out
          KCONFIG_CONFIG=out/.config scripts/kconfig/merge_config.sh -m -r \
            arch/arm64/configs/vendor/sm8150-perf_defconfig \
            arch/arm64/configs/vendor/oplus.config

      - name: Fix Configurations (After olddefconfig)
        run: |
          export PATH=$PWD/toolchains/bin:$PATH
          # প্রথমে olddefconfig চালানো
          make ARCH=arm64 O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 AS=llvm-as \
            olddefconfig
          
          # ⚡ এখন olddefconfig-এর পরে জোর করে কনফিগ বসানো
          # (তবে এবার olddefconfig আর চালানো হবে না, তাই এটি টিক থাকবে)
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' out/.config
          sed -i 's/CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/' out/.config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_REGULAR=y/# CONFIG_CC_STACKPROTECTOR_REGULAR is not set/' out/.config
          
          # জরুরি কনফিগ যোগ
          echo "CONFIG_COMPAT=y" >> out/.config
          echo "CONFIG_NR_CPUS=8" >> out/.config
          echo "# CONFIG_BPFILTER is not set" >> out/.config
          echo "# CONFIG_MHI_BUS_ARCH_QCOM is not set" >> out/.config
          
          # নিশ্চিত করা যে কনফিগ বসেছে
          grep -E "STACKPROTECTOR" out/.config || echo "No stack protector found (good)"

      - name: Build Kernel (Image.gz)
        run: |
          export PATH=$PWD/toolchains/bin:$PATH
          export KCFLAGS="-DFULL_THROTTLE_BOOST=1 -Wno-error=implicit-function-declaration -Wno-error=declaration-after-statement -Wno-error=unused-variable -Wno-error=int-conversion -Wno-error=macro-redefined -Wno-error=incompatible-pointer-types -Wno-error=shift-count-overflow -Wno-error=return-type -Wno-error=maybe-uninitialized"
          make -j$(nproc) ARCH=arm64 O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 AS=llvm-as \
            Image.gz

      - name: Build Modules
        run: |
          export PATH=$PWD/toolchains/bin:$PATH
          export KCFLAGS="-DFULL_THROTTLE_BOOST=1 -Wno-error=implicit-function-declaration -Wno-error=declaration-after-statement -Wno-error=unused-variable -Wno-error=int-conversion -Wno-error=macro-redefined -Wno-error=incompatible-pointer-types -Wno-error=shift-count-overflow -Wno-error=return-type -Wno-error=maybe-uninitialized"
          make -j$(nproc) ARCH=arm64 O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 AS=llvm-as \
            modules || true

      - name: Clone AnyKernel3 & Prepare Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git -b master
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          mkdir -p AnyKernel3/modules
          find out -name "*.ko" -exec cp {} AnyKernel3/modules/ \; 2>/dev/null || true
          cd AnyKernel3
          zip -r ../NetHunter_Kernel_OnePlus_SM8150.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-Zip
          path: NetHunter_Kernel_OnePlus_SM8150.zip
